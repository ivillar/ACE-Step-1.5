defaults:
  - system: default
  - params: default
  - generation: default
  - _self_

# Prevent Hydra from changing the working directory
hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

# Pipeline flags (not in GenerationParams/GenerationConfig)
sample_mode: false
sample_query: ""
use_format: false
